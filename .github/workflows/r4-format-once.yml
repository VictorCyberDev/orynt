name: R4 format billing regression once
on:
  push:
    branches: ["claude/busy-goodall-ajeb0p"]
    paths: [".github/workflows/r4-format-once.yml"]
permissions: { contents: write }
jobs:
  apply-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: true }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/api/test/saas.itest.ts
      - name: Commit formatted result only
        run: |
          if ! git diff --quiet -- apps/api/test/saas.itest.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/api/test/saas.itest.ts
            git commit -m "style(test): apply Prettier to billing regression"
            git push origin HEAD:claude/busy-goodall-ajeb0p
          fi
