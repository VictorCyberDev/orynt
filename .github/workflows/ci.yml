name: ci
on: { push: { branches: [main, "claude/**"] }, pull_request: {} }
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: orynt, POSTGRES_PASSWORD: orynt, POSTGRES_DB: orynt_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orynt" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_ADMIN_DATABASE_URL: postgres://orynt:orynt@127.0.0.1:5432/orynt_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:all
      - run: pnpm test:integration
      - run: pnpm audit --prod --audit-level=high
        continue-on-error: true   # advisory feed availability varies; review output
      # Browser E2E needs Chromium: `npx playwright install --with-deps chromium` then `node apps/web/e2e/run.cjs` (not enabled by default here).
      # Real-Lightning acceptance (pnpm regtest:fetch && pnpm regtest:up && pnpm test:real-lightning) is run manually; it has never been run in CI.
