name: ci
on: { push: { branches: [main, "claude/**"] }, pull_request: {} }
permissions: { contents: read }
concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  verify:
    name: "verify - lint, typecheck, unit, build, integration (simulator)"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: orynt, POSTGRES_PASSWORD: orynt, POSTGRES_DB: orynt_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orynt" --health-interval 5s --health-timeout 3s --health-retries 20
    env: { TEST_ADMIN_DATABASE_URL: "postgres://orynt:orynt@127.0.0.1:5432/orynt_test" }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:all
      - run: pnpm test:integration

  audit:
    name: "dependency audit (hard gate - high and critical, production deps)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high   # no continue-on-error: a real advisory fails the release gate

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  real-lightning:
    name: "real Lightning on regtest (bitcoind + 2 LND nodes)"
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: orynt, POSTGRES_PASSWORD: orynt, POSTGRES_DB: orynt_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orynt" --health-interval 5s --health-timeout 3s --health-retries 20
    env: { TEST_ADMIN_DATABASE_URL: "postgres://orynt:orynt@127.0.0.1:5432/orynt_test" }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - run: pnpm regtest:fetch          # refuses to continue unless SHA-256 matches infra/regtest/versions.env
      - run: pnpm regtest:up
      - run: pnpm --filter @orynt/verifier build
      - run: pnpm test:real-lightning
      - run: pnpm demo:full
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: regtest-logs, path: ".regtest/*.log" }
      - if: always()
        run: pnpm regtest:down

  e2e:
    name: "browser E2E (Chromium, 375, 768, 1440, axe)"
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: orynt, POSTGRES_PASSWORD: orynt, POSTGRES_DB: orynt_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orynt" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - run: npm install -g playwright && npx playwright install --with-deps chromium
      - run: pnpm --filter @orynt/web build
      - run: NODE_PATH="$(npm root -g)" pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: e2e-screenshots, path: docs/evidence/screenshots }

  docker:
    name: "container image builds and starts"
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t orynt:ci .
      - name: smoke (migrates a fresh database, serves health)
        run: |
          docker network create orynt-ci
          docker run -d --name pg --network orynt-ci -e POSTGRES_USER=orynt -e POSTGRES_PASSWORD=orynt -e POSTGRES_DB=orynt_ci postgres:16
          for i in $(seq 1 30); do docker exec pg pg_isready -U orynt && break; sleep 2; done
          docker run -d --name api --network orynt-ci -p 8787:8787 -e ORYNT_ENV=production -e ORYNT_SECRET_KEY=$(openssl rand -hex 32) -e ORYNT_ISSUER_KEY=$(openssl rand -hex 32) -e DATABASE_URL=postgres://orynt:orynt@pg:5432/orynt_ci orynt:ci
          for i in $(seq 1 40); do curl -fsS localhost:8787/health/ready && exit 0; sleep 2; done
          docker logs api; exit 1
