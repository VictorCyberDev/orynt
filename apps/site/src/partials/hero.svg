<svg viewBox="0 0 600 440" role="img" aria-labelledby="hero-t hero-d" xmlns="http://www.w3.org/2000/svg">
<title id="hero-t">Scattered payment records resolving into one ordered receipt</title>
<desc id="hero-d">On the left, six separate places a payout usually leaves traces: a chat message, a spreadsheet row, a wallet app, a screenshot, an invoice and an email thread. Dotted lines carry them through a single gate, and from there to an ordered receipt on the right with five steps: obligation, approved, sent once, settled, and proof that can be checked offline. This is an illustration, not a real receipt.</desc>
<path class="dots" d="M205 20 C255 20 250 150 296 150"/>
<path class="dots" d="M236 124 C286 124 250 174 296 174"/>
<path class="dots" d="M173 181 C223 181 250 198 296 198"/>
<path class="dots" d="M249 287 C299 287 250 222 296 222"/>
<path class="dots" d="M147 340 C197 340 250 246 296 246"/>
<path class="dots" d="M249 418 C299 418 250 270 296 270"/>
<line class="edge" x1="300" y1="138" x2="300" y2="282"/>
<path class="dots" d="M304 210 L330 210"/>
<circle class="dot-teal" cx="300" cy="210" r="9"/>
<g transform="translate(8 14) rotate(-5)"><rect class="chip" width="190" height="46" rx="10"/><text class="svg-text" x="16" y="30" font-size="22">chat message</text></g>
<g transform="translate(50 88) rotate(4)"><rect class="chip" width="182" height="46" rx="10"/><text class="svg-text" x="16" y="30" font-size="22">sheet, row 14</text></g>
<g transform="translate(6 166) rotate(-3)"><rect class="chip" width="160" height="46" rx="10"/><text class="svg-text" x="16" y="30" font-size="22">wallet app</text></g>
<g transform="translate(40 246) rotate(5)"><rect class="chip" width="206" height="46" rx="10"/><text class="svg-text svg-mono" x="16" y="30" font-size="19">screenshot.png</text></g>
<g transform="translate(10 326) rotate(-4)"><rect class="chip" width="130" height="46" rx="10"/><text class="svg-text" x="16" y="30" font-size="22">invoice</text></g>
<g transform="translate(62 386) rotate(3)"><rect class="chip" width="182" height="46" rx="10"/><text class="svg-text" x="16" y="30" font-size="22">email thread</text></g>
<rect class="card-svg" x="338" y="30" width="252" height="380" rx="14"/>
<text class="svg-text svg-muted svg-mono" x="362" y="64" font-size="16" letter-spacing="2">RECEIPT</text>
<text class="svg-text svg-muted" x="578" y="64" font-size="16" text-anchor="end">illustration</text>
<line class="rule" x1="362" y1="78" x2="566" y2="78"/>
<line class="rule" x1="372" y1="120" x2="372" y2="148"/>
<circle class="node" cx="372" cy="108" r="9" style="stroke:var(--primary);stroke-width:3"/>
<text class="svg-text svg-strong" x="396" y="114" font-size="24">Obligation</text>
<text class="svg-text svg-muted" x="396" y="136" font-size="19">exact amount</text>
<line class="rule" x1="372" y1="172" x2="372" y2="200"/>
<circle class="node" cx="372" cy="160" r="9" style="stroke:var(--primary);stroke-width:3"/>
<text class="svg-text svg-strong" x="396" y="166" font-size="24">Approved</text>
<text class="svg-text svg-muted" x="396" y="188" font-size="19">signed by people</text>
<line class="rule" x1="372" y1="224" x2="372" y2="252"/>
<circle class="node" cx="372" cy="212" r="9" style="stroke:var(--primary);stroke-width:3"/>
<text class="svg-text svg-strong" x="396" y="218" font-size="24">Sent once</text>
<text class="svg-text svg-muted" x="396" y="240" font-size="19">never twice</text>
<line class="rule" x1="372" y1="276" x2="372" y2="304"/>
<circle class="node" cx="372" cy="264" r="9" style="stroke:var(--primary);stroke-width:3"/>
<text class="svg-text svg-strong" x="396" y="270" font-size="24">Settled</text>
<text class="svg-text svg-muted" x="396" y="292" font-size="19">wallet’s record</text>
<circle class="dot-teal" cx="372" cy="316" r="9"/>
<text class="svg-text svg-strong" x="396" y="322" font-size="24">Proof</text>
<text class="svg-text svg-muted" x="396" y="344" font-size="19">preimage, offline</text>
<rect class="node node--ok" x="362" y="366" width="204" height="30" rx="8"/>
<text class="svg-text t-ok" x="378" y="387" font-size="18" font-weight="600">verify it offline</text>
</svg>
